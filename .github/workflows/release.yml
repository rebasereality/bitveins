name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  private-source:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    steps:
      - name: Publish private source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --verify-tag

  native-linux-x64:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate release tag
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Quality gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:coverage
          pnpm test:cli:coverage
          pnpm test:hermes-plugin

      - name: Build native release
        env:
          BITVEINS_COMMIT: ${{ github.sha }}
          BITVEINS_VERSION: ${{ github.ref_name }}
        run: |
          BITVEINS_VERSION="${BITVEINS_VERSION#v}" pnpm build:release
          BITVEINS_VERSION="${BITVEINS_VERSION#v}" pnpm verify:release
          BITVEINS_VERSION="${BITVEINS_VERSION#v}" pnpm smoke:install
          BITVEINS_VERSION="${BITVEINS_VERSION#v}" pnpm smoke:release

      - name: Attest release archive
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/native/*.tar.gz

      - name: Prepare offline provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "$ATTESTATION_BUNDLE" \
            "dist/native/bitveins-v${VERSION}-linux-x64.tar.gz.sigstore.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            install.sh \
            dist/native/*.tar.gz \
            dist/native/*.sha256 \
            dist/native/*.manifest.json \
            dist/native/*.sigstore.json \
            --generate-notes \
            --verify-tag
