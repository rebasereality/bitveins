name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: |
          pnpm test:coverage
          pnpm test:cli:coverage

      - name: Hermes plugin tests
        run: pnpm test:hermes-plugin

      - name: Codex plugin tests
        run: pnpm test:codex-plugin

      - name: Production Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke test
        run: pnpm test:e2e

      - name: Build and smoke native artifact
        run: |
          node scripts/build-release.ts
          pnpm verify:release
          pnpm smoke:install
          pnpm smoke:release
